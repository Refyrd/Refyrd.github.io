<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Snake // Refyrd Games</title>
  <meta name="description" content="Classic snake game with responsive swipe and keyboard controls.">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="snake.css">
  <script src="../js/theme.js"></script>
</head>
<body class="game-page-body">
  <!-- Apple Global Nav Bar (44px) -->
  <nav class="global-nav" aria-label="Global Navigation">
    <div class="global-nav-inner">
      <a href="../" class="global-nav-brand">
        <span>Refyrd Games</span>
      </a>
      <ul class="global-nav-links">
        <li><a href="../snake/" class="global-nav-link">Snake</a></li>
        <li><a href="../arkanoid/" class="global-nav-link">Arkanoid</a></li>
        <li><a href="https://github.com/Refyrd/Refyrd.github.io" target="_blank" rel="noopener noreferrer" class="global-nav-link">GitHub</a></li>
        <li>
          <button class="nav-theme-btn" type="button" aria-label="Toggle dark mode">
            <span id="theme-icon" aria-hidden="true">◐</span>
            <span id="theme-text">Dark</span>
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <div class="game-page-main">
    <div class="game-layout">
    <!-- Top Navigation Bar -->
    <header class="game-nav-header">
      <a href="../" class="nav-back-link">
        <span aria-hidden="true">←</span>
        <span>All Games</span>
      </a>

      <div class="game-nav-meta">
        <h1 class="game-nav-title">Snake</h1>
        <span class="game-nav-badge">Classic</span>
        <span id="debug-badge" class="debug-indicator hidden">CHEAT ACTIVE</span>
      </div>

      <div class="game-nav-actions">
        <button id="sound-toggle" class="btn-ctrl" type="button" aria-label="Sound" aria-pressed="false">
          Sound: <span id="sound-status">off</span>
        </button>
      </div>
    </header>

    <!-- Main Game Board Container -->
    <main class="game-board-wrapper">
      <!-- Score & Status Bar -->
      <div class="game-status-panel">
        <div class="score-box">
          <span class="score-label">Score</span>
          <span class="score-digit" id="score-display">000</span>
        </div>

        <div class="score-box">
          <span class="score-label">Best</span>
          <span class="score-digit highlight" id="best-display">000</span>
        </div>

        <div class="game-quick-actions">
          <button id="btn-pause" class="btn-ctrl" type="button" title="Pause (click 10 times for debug menu)">Pause</button>
          <button id="btn-restart" class="btn-ctrl btn-accent" type="button">Restart</button>
        </div>
      </div>

      <!-- Playfield Screen -->
      <div class="canvas-screen-box">
        <canvas id="game-canvas" width="400" height="400" aria-label="Snake game playfield" tabindex="0"></canvas>

        <!-- Overlay Dialog (Pause / Game Over / Victory) -->
        <div id="game-overlay" class="game-overlay hidden" aria-live="polite">
          <div class="overlay-dialog">
            <h2 class="overlay-heading" id="overlay-heading">Paused</h2>
            <p class="overlay-desc" id="overlay-desc">Press Space or the button below to resume the game.</p>
            <button id="overlay-btn" class="btn-ctrl btn-primary-action" type="button">Resume</button>
          </div>
        </div>
      </div>

      <!-- Draggable Debug Window (10 clicks on Pause button) -->
      <div id="debug-modal" class="debug-window hidden" aria-live="polite">
        <div class="debug-window-header" id="debug-drag-handle">
          <div class="debug-window-title">
            <span class="debug-drag-icon" aria-hidden="true">⠿</span>
            <span>Debug Menu</span>
          </div>
          <button id="dbg-close" class="debug-close-btn" type="button" aria-label="Close">✕</button>
        </div>
        <div class="debug-window-body">
          <p class="overlay-desc debug-warning">
            Actions in debug mode disable high score recording.
          </p>
          <div class="debug-actions-grid">
            <button id="dbg-add-length" class="btn-ctrl" type="button">+5 Snake Length</button>
            <button id="dbg-sound-eat" class="btn-ctrl" type="button">Test Sound (Eat)</button>
            <button id="dbg-sound-hit" class="btn-ctrl" type="button">Test Sound (Hit)</button>
            <button id="dbg-win" class="btn-ctrl btn-accent" type="button">Trigger Victory</button>
            <button id="dbg-gameover" class="btn-ctrl" type="button">Trigger Game Over</button>
          </div>
        </div>
      </div>

      <!-- Controls Guide -->
      <footer class="game-controls-footer">
        <div class="controls-hint-row">
          <span class="controls-hint-item">Swipe with touch or mouse to turn</span>
          <span class="controls-hint-item"><kbd>Arrows</kbd> / <kbd>WASD</kbd></span>
          <span class="controls-hint-item"><kbd>Space</kbd> pause</span>
        </div>
      </footer>
    </main>
    </div>
  </div>

  <script src="snake.js"></script>
</body>
</html>
